    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #121212; color: #ffffff; font-family: 'Roboto Mono', monospace; }
    .obk-stage {
      position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
      background: #121212; color: #ffffff;

    .obk-stage.obk-grabbing { cursor: grabbing; }
    .obk-workspace {
      --obk-zoom: 1;

      --obk-off-y: 0px;
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.75rem;
      transform: translate(var(--obk-off-x), var(--obk-off-y)) scale(var(--obk-zoom));
      transform-origin: center center;
      pointer-events: none;
    }
    .obk-stack { pointer-events: auto; text-align: center; padding: 2rem; max-width: 100%; }
    .obk-logo {
      display: inline-flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 0;

<body>
  <div class="obk-stage" id="obkStage" role="presentation">
    <div class="obk-workspace" id="obkWorkspace">
      <div class="obk-stack">
        <div class="obk-logo" role="button" tabindex="0" title="Clic: [texto] ↔ [primera letra]. Arrastra el fondo o zoom con la rueda. Doble clic en el fondo: restablecer vista." aria-label="Logo. Clic para compactar o expandir."><span class="obk-char obk-br">[</span><span class="obk-char obk-mid">o</span><span class="obk-char obk-mid obk-mid-extra">b</span><span class="obk-char obk-mid obk-mid-extra">e</span><span class="obk-char obk-mid obk-mid-extra">k</span><span class="obk-char obk-mid obk-mid-extra">o</span><span class="obk-char obk-br">]</span></div>
        <div class="obk-terminal-wrap" aria-live="polite">
          <div class="obk-terminal-row"><span class="obk-terminal-prompt">&gt;</span><span class="obk-terminal-out"></span><span class="obk-terminal-cursor" aria-hidden="true"></span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
(function () {
  var stage = document.getElementById('obkStage');
  var workspace = document.getElementById('obkWorkspace');
  var logo = document.querySelector('.obk-logo');
  var terminal = document.querySelector('.obk-terminal-wrap');
  var zoom = 1;
  var offX = 0;
  var offY = 0;
  var isDragging = false;
  var pendingLogo = false;
  var pendingStartX = 0;
  var pendingStartY = 0;
  var panStartX = 0;
  var panStartY = 0;
  function applyPanZoom() {
    workspace.style.setProperty('--obk-zoom', String(zoom));
    workspace.style.setProperty('--obk-off-x', offX + 'px');
    workspace.style.setProperty('--obk-off-y', offY + 'px');
  }
  function toggleCompact() {
    logo.classList.toggle('obk-compact');
  }
  logo.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCompact(); }
  });
  stage.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    if (logo.contains(e.target)) {
      pendingLogo = true;
      pendingStartX = e.clientX;
      pendingStartY = e.clientY;
      return;
    }
    isDragging = true;
    stage.classList.add('obk-grabbing');
    panStartX = e.clientX - offX;
    panStartY = e.clientY - offY;
  });
  window.addEventListener('mousemove', function (e) {
    var radius = 180 * zoom;
    if (pendingLogo && !isDragging) {
      var dx0 = e.clientX - pendingStartX;
      var dy0 = e.clientY - pendingStartY;
      if (dx0 * dx0 + dy0 * dy0 > 36) {
        pendingLogo = false;
        isDragging = true;
        stage.classList.add('obk-grabbing');
        panStartX = e.clientX - offX;
        panStartY = e.clientY - offY;
      }
    }
    if (isDragging) {
      offX = e.clientX - panStartX;
      offY = e.clientY - panStartY;
      applyPanZoom();
    } else if (!pendingLogo) {
      var chars = document.querySelectorAll('.obk-char');
      var mouseX = e.clientX, mouseY = e.clientY;
      chars.forEach(function (char) {
        if (window.getComputedStyle(char).display === 'none') return;
        var rect = char.getBoundingClientRect();
        var charX = rect.left + rect.width / 2, charY = rect.top + rect.height / 2;
        var dx = mouseX - charX, dy = mouseY - charY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 1) return;
        if (dist < radius) {
          var force = (radius - dist) / radius;
          char.style.transform = 'translate(' + (dx / dist) * force * -70 * zoom + 'px,' + (dy / dist) * force * -70 * zoom + 'px) rotate(' + (force * 20 * (Math.sin(char.offsetLeft) * 0.5)) + 'deg)';
        } else char.style.transform = 'none';
      });
    }
  });
  window.addEventListener('mouseup', function (e) {
    if (e.button !== 0) return;
    if (pendingLogo && !isDragging) toggleCompact();
    pendingLogo = false;
    isDragging = false;
    stage.classList.remove('obk-grabbing');
  });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom = Math.min(Math.max(zoom * (e.deltaY > 0 ? 0.9 : 1.1), 0.1), 8);
    applyPanZoom();
  }, { passive: false });
  stage.addEventListener('dblclick', function (e) {
    if (logo.contains(e.target) || terminal.contains(e.target)) return;
    e.preventDefault();
    zoom = 1;
    offX = 0;
    offY = 0;
    applyPanZoom();
  });
})();
(function () {
  var el = document.querySelector('.obk-terminal-out');
  var lines = [
    'Sitio en construcción',
    'Site under construction',
    'Gunea eraikitzen',
    'Lloc en construcció',
    'Site en construction',
    'Sito in costruzione',
    'Website im Aufbau',
    'Site în construcție',
    '网站建设中',
    'Сайт в разработке',
    'Site em construção',
    'サイト構築中',
    'Strona w budowie',
    'Ιστότοπος υπό κατασκευή'
  ];
  var idx = 0;
  var sub = '';
  var mode = 'type';
  function tick() {
    var full = lines[idx % lines.length];
    if (mode === 'type') {
      if (sub.length < full.length) {
        sub = full.slice(0, sub.length + 1);
        el.textContent = sub;
        setTimeout(tick, 38);
      } else {
        mode = 'wait';
        setTimeout(tick, 2600);
      }
    } else if (mode === 'wait') {
      mode = 'del';
      setTimeout(tick, 280);
    } else if (mode === 'del') {
      if (sub.length > 0) {
        sub = sub.slice(0, -1);
        el.textContent = sub;
        setTimeout(tick, 20);
      } else {
        mode = 'type';
        idx++;
        setTimeout(tick, 450);
      }
    }
  }
  tick();
})();
  </script>
